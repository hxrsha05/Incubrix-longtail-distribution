components:
  schemas:
    Destination:
      properties:
        base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Base Url
        community:
          anyOf:
          - type: string
          - type: 'null'
          title: Community
        connector_key:
          title: Connector Key
          type: string
        extra:
          additionalProperties: true
          title: Extra
          type: object
        name:
          title: Name
          type: string
        rules:
          additionalProperties: true
          title: Rules
          type: object
        spec:
          additionalProperties: true
          title: Spec
          type: object
        surface:
          anyOf:
          - type: string
          - type: 'null'
          title: Surface
      required:
      - name
      - connector_key
      title: Destination
      type: object
    DestinationIn:
      properties:
        destination:
          $ref: '#/components/schemas/Destination'
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
        topics:
          items:
            type: string
          title: Topics
          type: array
      required:
      - destination
      title: DestinationIn
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    JobRequest:
      properties:
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
        kind:
          minLength: 1
          title: Kind
          type: string
        params:
          additionalProperties: true
          title: Params
          type: object
      required:
      - kind
      title: JobRequest
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  title: IncuBrix Long-Tail Distribution
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/destinations:
    get:
      operationId: list_destinations_api_v1_destinations_get
      parameters:
      - in: query
        name: connector_key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Connector Key
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - in: query
        name: language
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
      - in: query
        name: q
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Destinations Api V1 Destinations Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Destinations
    post:
      description: Add a destination (201) or update the one with the same name (200).
        Same Idempotency-Key = same answer.
      operationId: upsert_destination_api_v1_destinations_post
      parameters:
      - in: header
        name: idempotency-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Upsert Destination
  /api/v1/destinations/{dest_id}:
    delete:
      operationId: delete_destination_api_v1_destinations__dest_id__delete
      parameters:
      - in: path
        name: dest_id
        required: true
        schema:
          title: Dest Id
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Destination
    get:
      operationId: get_destination_api_v1_destinations__dest_id__get
      parameters:
      - in: path
        name: dest_id
        required: true
        schema:
          title: Dest Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Destination Api V1 Destinations  Dest Id  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Destination
  /api/v1/destinations/{dest_id}/certifications:
    get:
      operationId: list_certifications_api_v1_destinations__dest_id__certifications_get
      parameters:
      - in: path
        name: dest_id
        required: true
        schema:
          title: Dest Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Certifications Api V1 Destinations  Dest Id  Certifications
                  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Certifications
  /api/v1/destinations/{dest_id}/certify:
    post:
      operationId: certify_destination_api_v1_destinations__dest_id__certify_post
      parameters:
      - in: path
        name: dest_id
        required: true
        schema:
          title: Dest Id
          type: string
      - in: header
        name: idempotency-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      responses:
        '202':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Certify Destination
  /api/v1/evidence/{path}:
    get:
      operationId: download_evidence_api_v1_evidence__path__get
      parameters:
      - in: path
        name: path
        required: true
        schema:
          title: Path
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Download Evidence
  /api/v1/health:
    get:
      operationId: health_check_api_v1_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Health Check Api V1 Health Get
                type: object
          description: Successful Response
      summary: Health Check
  /api/v1/jobs:
    post:
      operationId: create_job_api_v1_jobs_post
      parameters:
      - in: header
        name: idempotency-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Job
  /api/v1/jobs/{job_id}:
    get:
      operationId: get_job_api_v1_jobs__job_id__get
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          title: Job Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Job Api V1 Jobs  Job Id  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Job
  /api/v1/ready:
    get:
      operationId: ready_check_api_v1_ready_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Ready Check
  /connector/v1/{connector_key}/{method}:
    post:
      operationId: call_connector_connector_v1__connector_key___method__post
      parameters:
      - in: path
        name: connector_key
        required: true
        schema:
          title: Connector Key
          type: string
      - in: path
        name: method
        required: true
        schema:
          title: Method
          type: string
      - in: header
        name: idempotency-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              title: Body
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Call Connector
  /health:
    get:
      operationId: health_check_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Health Check Health Get
                type: object
          description: Successful Response
      summary: Health Check
  /ready:
    get:
      operationId: ready_check_ready_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Ready Check
