components:
  schemas:
    Acknowledge:
      properties:
        acknowledged_by:
          minLength: 1
          title: Acknowledged By
          type: string
      required:
      - acknowledged_by
      title: Acknowledge
      type: object
    CaptureRequest:
      properties:
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
      title: CaptureRequest
      type: object
    ConfirmRequest:
      properties:
        acknowledge_loosening:
          default: false
          title: Acknowledge Loosening
          type: boolean
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        overrides:
          additionalProperties: true
          description: rule values the reviewer sets themselves instead of the proposal's
          title: Overrides
          type: object
        reviewer:
          description: the person confirming; recorded with the decision
          minLength: 1
          title: Reviewer
          type: string
      required:
      - reviewer
      title: ConfirmRequest
      type: object
    Destination:
      properties:
        base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Base Url
        community:
          anyOf:
          - type: string
          - type: 'null'
          title: Community
        connector_key:
          title: Connector Key
          type: string
        extra:
          additionalProperties: true
          title: Extra
          type: object
        name:
          title: Name
          type: string
        rules:
          additionalProperties: true
          title: Rules
          type: object
        spec:
          additionalProperties: true
          title: Spec
          type: object
        surface:
          anyOf:
          - type: string
          - type: 'null'
          title: Surface
      required:
      - name
      - connector_key
      title: Destination
      type: object
    DestinationIn:
      properties:
        destination:
          $ref: '#/components/schemas/Destination'
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
        topics:
          items:
            type: string
          title: Topics
          type: array
      required:
      - destination
      title: DestinationIn
      type: object
    FailureSwitch:
      properties:
        count:
          anyOf:
          - type: integer
          - type: 'null'
          description: how many times it fires (default once; a renamed field stays
            until reset)
          title: Count
        delay_s:
          default: 3.0
          description: how late the answer comes (timeout_*)
          title: Delay S
          type: number
        kind:
          default: status
          description: status | timeout_before | timeout_after | rename_field
          title: Kind
          type: string
        op:
          default: any
          description: create | read | update | delete | any
          title: Op
          type: string
        platform:
          description: discourse | devto | partner | hashnode | kit
          title: Platform
          type: string
        rename:
          additionalProperties:
            type: string
          description: 'for kind rename_field, for example {"topic_id": "topic_identifier"}'
          title: Rename
          type: object
        retry_after:
          anyOf:
          - type: number
          - type: 'null'
          description: seconds the platform says to wait (status 429)
          title: Retry After
        status:
          default: 500
          title: Status
          type: integer
      required:
      - platform
      title: FailureSwitch
      type: object
    FeedItemIn:
      properties:
        canonical_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Canonical Url
        description:
          default: ''
          title: Description
          type: string
        guid:
          maxLength: 100
          minLength: 1
          title: Guid
          type: string
        link:
          anyOf:
          - type: string
          - type: 'null'
          title: Link
        media:
          items:
            additionalProperties: true
            type: object
          title: Media
          type: array
        tags:
          items:
            type: string
          title: Tags
          type: array
        title:
          title: Title
          type: string
      required:
      - guid
      - title
      title: FeedItemIn
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    JobRequest:
      properties:
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
        kind:
          minLength: 1
          title: Kind
          type: string
        params:
          additionalProperties: true
          title: Params
          type: object
      required:
      - kind
      title: JobRequest
      type: object
    Media:
      properties:
        kind:
          default: image
          enum:
          - image
          - video
          - file
          title: Kind
          type: string
        mime_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Mime Type
        url:
          title: Url
          type: string
      required:
      - url
      title: Media
      type: object
    PublishByDestination:
      properties:
        destination_id:
          title: Destination Id
          type: string
        idempotency_key:
          anyOf:
          - type: string
          - type: 'null'
          description: the Idempotency-Key header works too
          title: Idempotency Key
        rendition:
          $ref: '#/components/schemas/Rendition'
        tailor:
          default: true
          description: fit the content to the destination first (every change is listed
            in the answer)
          title: Tailor
          type: boolean
      required:
      - destination_id
      - rendition
      title: PublishByDestination
      type: object
    RecommendRequest:
      properties:
        connector_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Connector Key
        rendition:
          $ref: '#/components/schemas/Rendition'
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        top:
          default: 10
          maximum: 100.0
          minimum: 1.0
          title: Top
          type: integer
      required:
      - rendition
      title: RecommendRequest
      type: object
    RejectRequest:
      properties:
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        reviewer:
          minLength: 1
          title: Reviewer
          type: string
      required:
      - reviewer
      title: RejectRequest
      type: object
    RelevanceRequest:
      properties:
        connector_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Connector Key
        destination_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Destination Ids
        rendition:
          $ref: '#/components/schemas/Rendition'
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        top:
          anyOf:
          - maximum: 1000.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Top
      required:
      - rendition
      title: RelevanceRequest
      type: object
    Rendition:
      properties:
        ai_disclosure:
          anyOf:
          - type: string
          - type: 'null'
          title: Ai Disclosure
        ai_generated:
          default: false
          title: Ai Generated
          type: boolean
        body:
          default: ''
          title: Body
          type: string
        canonical_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Canonical Url
        content_type:
          default: text
          title: Content Type
          type: string
        language:
          default: en
          title: Language
          type: string
        link_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Link Url
        media:
          default: []
          items:
            $ref: '#/components/schemas/Media'
          title: Media
          type: array
        promotional:
          default: false
          title: Promotional
          type: boolean
        tags:
          default: []
          items:
            type: string
          title: Tags
          type: array
        title:
          title: Title
          type: string
      required:
      - title
      title: Rendition
      type: object
    TailorRequest:
      properties:
        destination_id:
          title: Destination Id
          type: string
        rendition:
          $ref: '#/components/schemas/Rendition'
      required:
      - rendition
      - destination_id
      title: TailorRequest
      type: object
    TailoredResult:
      properties:
        changes:
          default: []
          items:
            type: string
          title: Changes
          type: array
        rendition:
          $ref: '#/components/schemas/Rendition'
        warnings:
          default: []
          items:
            type: string
          title: Warnings
          type: array
      required:
      - rendition
      title: TailoredResult
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  title: IncuBrix Long-Tail Distribution
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/alerts:
    get:
      operationId: list_alerts_api_v1_alerts_get
      parameters:
      - in: query
        name: unacknowledged
        required: false
        schema:
          default: false
          title: Unacknowledged
          type: boolean
      - in: query
        name: destination_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Destination Id
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Alerts Api V1 Alerts Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Alerts
  /api/v1/alerts/{alert_id}/acknowledge:
    post:
      operationId: acknowledge_alert_api_v1_alerts__alert_id__acknowledge_post
      parameters:
      - in: path
        name: alert_id
        required: true
        schema:
          title: Alert Id
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Acknowledge'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Acknowledge Alert Api V1 Alerts  Alert Id  Acknowledge
                  Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Acknowledge Alert
  /api/v1/catalogue/export:
    get:
      description: Every destination as the destination record (name, url, platform_key,
        ... relevance_score, relevance_reason, level, last_certified_at).
      operationId: export_catalogue_api_v1_catalogue_export_get
      parameters:
      - in: query
        name: format
        required: false
        schema:
          default: csv
          title: Format
          type: string
      - in: query
        name: connector_key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Connector Key
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Export Catalogue
  /api/v1/destinations:
    get:
      operationId: list_destinations_api_v1_destinations_get
      parameters:
      - in: query
        name: connector_key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Connector Key
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - in: query
        name: language
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
      - in: query
        name: q
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Destinations Api V1 Destinations Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Destinations
    post:
      description: Add a destination (201) or update the one with the same name (200).
        Same Idempotency-Key = same answer.
      operationId: upsert_destination_api_v1_destinations_post
      parameters:
      - in: header
        name: idempotency-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Upsert Destination
  /api/v1/destinations/{dest_id}:
    delete:
      operationId: delete_destination_api_v1_destinations__dest_id__delete
      parameters:
      - in: path
        name: dest_id
        required: true
        schema:
          title: Dest Id
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Destination
    get:
      operationId: get_destination_api_v1_destinations__dest_id__get
      parameters:
      - in: path
        name: dest_id
        required: true
        schema:
          title: Dest Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Destination Api V1 Destinations  Dest Id  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Destination
  /api/v1/destinations/{dest_id}/certifications:
    get:
      operationId: list_certifications_api_v1_destinations__dest_id__certifications_get
      parameters:
      - in: path
        name: dest_id
        required: true
        schema:
          title: Dest Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Certifications Api V1 Destinations  Dest Id  Certifications
                  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Certifications
  /api/v1/destinations/{dest_id}/certify:
    post:
      operationId: certify_destination_api_v1_destinations__dest_id__certify_post
      parameters:
      - in: path
        name: dest_id
        required: true
        schema:
          title: Dest Id
          type: string
      - in: header
        name: idempotency-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      responses:
        '202':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Certify Destination
  /api/v1/destinations/{dest_id}/rules/capture:
    post:
      description: 'Read a rules page (by address or pasted text) and create a PENDING
        proposal. Nothing is applied.

        Fetching a page and asking an AI model can take seconds, so this is a job:
        202 now, the proposal in the job result.'
      operationId: capture_rules_api_v1_destinations__dest_id__rules_capture_post
      parameters:
      - in: path
        name: dest_id
        required: true
        schema:
          title: Dest Id
          type: string
      - in: header
        name: idempotency-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Capture Rules
  /api/v1/destinations/{dest_id}/rules/proposals:
    get:
      operationId: list_proposals_api_v1_destinations__dest_id__rules_proposals_get
      parameters:
      - in: path
        name: dest_id
        required: true
        schema:
          title: Dest Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Proposals Api V1 Destinations  Dest Id  Rules
                  Proposals Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Proposals
  /api/v1/evidence/{path}:
    get:
      operationId: download_evidence_api_v1_evidence__path__get
      parameters:
      - in: path
        name: path
        required: true
        schema:
          title: Path
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Download Evidence
  /api/v1/feeds/{feed_id}/items:
    post:
      operationId: add_item_api_v1_feeds__feed_id__items_post
      parameters:
      - in: path
        name: feed_id
        required: true
        schema:
          title: Feed Id
          type: string
      - in: header
        name: x-feed-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Feed-Token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedItemIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Add Item Api V1 Feeds  Feed Id  Items Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Add Item
  /api/v1/feeds/{feed_id}/items/{guid}:
    delete:
      operationId: delete_item_api_v1_feeds__feed_id__items__guid__delete
      parameters:
      - in: path
        name: feed_id
        required: true
        schema:
          title: Feed Id
          type: string
      - in: path
        name: guid
        required: true
        schema:
          title: Guid
          type: string
      - in: header
        name: x-feed-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Feed-Token
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Item
    get:
      operationId: get_item_api_v1_feeds__feed_id__items__guid__get
      parameters:
      - in: path
        name: feed_id
        required: true
        schema:
          title: Feed Id
          type: string
      - in: path
        name: guid
        required: true
        schema:
          title: Guid
          type: string
      - in: header
        name: x-feed-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Feed-Token
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Item Api V1 Feeds  Feed Id  Items  Guid  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Item
  /api/v1/health:
    get:
      operationId: health_check_api_v1_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Health Check Api V1 Health Get
                type: object
          description: Successful Response
      summary: Health Check
  /api/v1/import-files/{path}:
    get:
      operationId: download_import_file_api_v1_import_files__path__get
      parameters:
      - in: path
        name: path
        required: true
        schema:
          title: Path
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Download Import File
  /api/v1/imports:
    post:
      description: 'Body: the CSV itself (Content-Type text/csv) or JSON {"csv": "..."}.
        Columns: name, url (required); language, topics, connector_key, community
        (optional).'
      operationId: create_import_api_v1_imports_post
      parameters:
      - in: query
        name: commit
        required: false
        schema:
          default: true
          title: Commit
          type: boolean
      - in: query
        name: catalogue_only
        required: false
        schema:
          default: false
          title: Catalogue Only
          type: boolean
      - in: query
        name: callback_url
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
      - in: header
        name: idempotency-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      responses:
        '202':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Import
  /api/v1/jobs:
    post:
      operationId: create_job_api_v1_jobs_post
      parameters:
      - in: header
        name: idempotency-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Job
  /api/v1/jobs/{job_id}:
    get:
      operationId: get_job_api_v1_jobs__job_id__get
      parameters:
      - in: path
