key: lemmy
version: 1.0.0
tier: protocol          # Lemmy is an open, federated network with a documented HTTP API
auth: bot_token         # a bot account logs in and receives a JWT
surfaces:
  - key: post
    content_types: [text, image, video_link, article]
    spec: {title_max_chars: 200, body_max_chars: 50000, links_allowed: true, tag_style: none, canonical_supported: false, mention_style: at, media_kinds: [image], max_media: 10, framing: discussion}
rate_limits:
  per_connection: {requests: 60, per_seconds: 60}
capabilities: [publish, status, delete, metrics, refresh_auth]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
instance_param: base_url
