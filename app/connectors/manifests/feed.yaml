key: feed
version: 1.0.0
tier: feed              # we publish into an MRSS (Media RSS) feed that partners and aggregators poll
auth: api_key           # a token that lets us write to the feed; the feed itself is public to read
surfaces:
  - key: item
    content_types: [text, image, video_link, article]
    spec: {title_max_chars: 250, body_max_chars: 20000, links_allowed: true, tag_style: tags, max_tags: 10, canonical_supported: true, mention_style: none}
capabilities: [publish, status, delete]
error_map:
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "422": PLATFORM_CONTENT_REJECTED
  "429": PLATFORM_RATE_LIMIT
instance_param: base_url
