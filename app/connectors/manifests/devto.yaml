key: devto
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: article
    content_types: [article, text, video_link]
    spec: {title_max_chars: 128, body_max_chars: 100000, links_allowed: true, tag_style: tags, max_tags: 4, canonical_supported: true, mention_style: at}
rate_limits:
  per_connection: {requests: 30, per_seconds: 30}
capabilities: [publish, status, delete, metrics]   # delete = unpublish: Dev.to has no article delete
error_map:
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "422": PLATFORM_CONTENT_REJECTED
  "429": PLATFORM_RATE_LIMIT
instance_param: base_url
