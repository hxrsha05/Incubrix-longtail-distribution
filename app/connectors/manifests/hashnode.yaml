key: hashnode
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: article
    content_types: [article, text, video_link]
    spec: {title_max_chars: 250, body_max_chars: 1000000, links_allowed: true, tag_style: tags, max_tags: 5, canonical_supported: true, mention_style: at, media_kinds: [image], max_media: 10}
rate_limits:
  per_connection: {requests: 60, per_seconds: 60}
capabilities: [publish, status, delete, metrics]
error_map:
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "429": PLATFORM_RATE_LIMIT
instance_param: base_url
